<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Unsubscribe</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
        --focus: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        line-height: 1.5;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }
      .actions {
        margin-top: 16px;
      }
      a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
        border-radius: 6px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="status" aria-live="polite">
        <h1 id="title">Link expired</h1>
        <p id="body">This unsubscribe link is invalid or has already been used.</p>
        <div class="actions" id="actions" hidden>
          <a href="mailto:support@donnacrm.com" id="supportLink">Contact support</a>
        </div>
        <span class="sr-only" id="a11yStatus"></span>
      </div>
    </main>
    <script>
      (function () {
        var status = (new URLSearchParams(window.location.search).get("status") || "invalid").toLowerCase();
        var title = document.getElementById("title");
        var body = document.getElementById("body");
        var actions = document.getElementById("actions");
        var a11yStatus = document.getElementById("a11yStatus");

        var copyByStatus = {
          ok: {
            title: "Unsubscribed",
            body: "You won’t receive further emails from this organization.",
            support: false,
          },
          invalid: {
            title: "Link expired",
            body: "This unsubscribe link is invalid or has already been used.",
            support: false,
          },
          missing: {
            title: "Invalid link",
            body: "This unsubscribe link is missing required information.",
            support: false,
          },
          error: {
            title: "Something went wrong",
            body: "Please try again. If the problem continues, contact support.",
            support: true,
          },
        };

        var content = copyByStatus[status] || copyByStatus.invalid;
        title.textContent = content.title;
        body.textContent = content.body;
        actions.hidden = !content.support;
        a11yStatus.textContent = content.title;
      })();
    </script>
  </body>
</html>
